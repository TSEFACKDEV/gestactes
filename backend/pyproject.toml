[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gestactes-api"
version = "0.1.0"
description = "API GestActes — gestion des actes administratifs via GitHub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlmodel>=0.0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.9,<3",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt==4.0.1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "types-passlib>=1.7,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
exclude = ["tests/"]
# SQLModel expose les champs de table comme `bool`/`datetime` au typage
# statique, alors qu'ils sont des InstrumentedAttribute à l'exécution.
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/*", "app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
